# Site settings
title: My Linh Phung
tagline: Technical Writer
description: Technical writing portfolio showcasing documentation, tutorials, and guides.
url: https://mylinhpb.github.io
baseurl: ""

# Author
author:
  name: My Linh Phung
  email: mylinh.pb@gmail.com

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: text
    css_class: 'highlight'
  parse_block_html: true
  parse_span_html: true

# Collections
collections:
  articles:
    output: true
    permalink: /writing-samples/:path/
  case_studies:
    output: true
    permalink: /case-studies/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "case_studies"
    values:
      layout: "case-study"

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
