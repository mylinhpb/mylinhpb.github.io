# Site settings
title: My Linh Phung
tagline: Technical Writer
description: Technical writing portfolio showcasing documentation, tutorials, and guides.
url: https://mylinhpb.github.io
baseurl: ""

# Author
author:
  name: My Linh Phung
  email: your.email@example.com

# Build settings
markdown: kramdown
permalink: /:year/:month/:day/:title/

# Collections
collections:
  articles:
    output: true
    permalink: /articles/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "article"

# Exclude from build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
