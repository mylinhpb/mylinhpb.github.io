<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.title }}</a>
            <button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>
            <div class="nav-links" id="nav-links">
                <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
                <a href="{{ '/case-studies' | relative_url }}"
                    class="{% if page.url contains '/case-studies' %}active{% endif %}">Case Studies</a>
                <a href="{{ '/writing-samples' | relative_url }}"
                    class="{% if page.url contains '/writing-samples' %}active{% endif %}">Writing Samples</a>
                <a href="{{ '/about' | relative_url }}"
                    class="{% if page.url contains '/about' %}active{% endif %}">About</a>
                <a href="{{ '/contact' | relative_url }}"
                    class="{% if page.url contains '/contact' %}active{% endif %}">Contact</a>
            </div>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author.name }}. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Open all external links in new tab (site-wide)
            const links = document.querySelectorAll('a');
            links.forEach(function (link) {
                if (link.hostname && link.hostname !== window.location.hostname && link.hostname !== '') {
                    link.setAttribute('target', '_blank');
                    link.setAttribute('rel', 'noopener noreferrer');
                }
            });

            // Hamburger menu toggle
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('nav-links');
            const navbar = document.querySelector('.navbar');

            const navOverlay = document.getElementById('nav-overlay');

            function closeMenu() {
                navbar.classList.remove('nav-open');
                hamburger.setAttribute('aria-expanded', 'false');
                document.body.style.overflow = '';
                if (navOverlay) navOverlay.setAttribute('aria-hidden', 'true');
            }

            if (hamburger && navLinks) {
                hamburger.addEventListener('click', function () {
                    const isOpen = navbar.classList.toggle('nav-open');
                    hamburger.setAttribute('aria-expanded', isOpen);
                    document.body.style.overflow = isOpen ? 'hidden' : '';
                    if (navOverlay) navOverlay.setAttribute('aria-hidden', !isOpen);
                });

                if (navOverlay) {
                    navOverlay.addEventListener('click', closeMenu);
                }

                // Close menu when clicking a nav link (for mobile)
                navLinks.querySelectorAll('a').forEach(function (link) {
                    link.addEventListener('click', closeMenu);
                });

                // Close menu on resize to desktop
                window.addEventListener('resize', function () {
                    if (window.innerWidth > 768) closeMenu();
                });
            }
        });
    </script>
</body>

</html>
